<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Lyceum N6 · The Student Newsletter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600;1,9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF1DD; --card:#F3E6C8; --line:#1D2A47; --ink:#1D2A47; --ink-soft:#4B5471;
  --navy:#1D2A47; --on-navy:#FFF6E0; --on-navy-soft:#D8DCEB;
  --orange:#F2542D; --accent-text:#C0361A; --yellow:#FFD23F; --teal:#1F7A6E;
  --mint:#D5EDE6; --peach:#FBD8CC; --paper:#FFFFFF; --script:#6B4FBB;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10172A; --card:#1A2440; --line:#F4EAD2; --ink:#F4EAD2; --ink-soft:#B9BFD3;
    --navy:#0A1020; --on-navy:#F4EAD2; --on-navy-soft:#BEC4D8;
    --accent-text:#FF8460; --mint:#17373A; --peach:#3A2A30; --paper:#F8F1E0; --script:#B7A3FF;
  }
}
:root[data-theme="dark"]{
  --bg:#10172A; --card:#1A2440; --line:#F4EAD2; --ink:#F4EAD2; --ink-soft:#B9BFD3;
  --navy:#0A1020; --on-navy:#F4EAD2; --on-navy-soft:#BEC4D8;
  --accent-text:#FF8460; --mint:#17373A; --peach:#3A2A30; --paper:#F8F1E0; --script:#B7A3FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.62}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}

/* highlighter heading, from the print edition */
.hl{background:var(--yellow);color:#1D2A47;padding:.02em .22em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* masthead */
.topbar{border-bottom:3px solid var(--navy)}
.top-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 0;font-size:13px;font-weight:600}
.tag{border:2px solid var(--ink);background:var(--yellow);color:#1D2A47;padding:1px 9px;border-radius:4px;font-weight:700;font-size:12px}
.brand{display:block;text-align:center;text-decoration:none;padding:6px 0 0}
.brand h1{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(40px,8vw,84px);line-height:1;letter-spacing:-.01em}
.brand h1 span{color:var(--orange)}
.brand p{margin:4px 0 12px;font-family:var(--hand);font-size:22px;color:var(--ink-soft)}
.nav{display:flex;justify-content:center;gap:6px;border-top:2px solid var(--ink);padding:8px 0;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:600;padding:6px 16px;border-radius:999px;border:2px solid transparent}
.nav a:hover{border-color:var(--ink)}
.nav a[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
.theme-btn{background:none;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600}

main{padding:36px 0 72px;min-height:60vh}
footer{border-top:3px solid var(--navy);padding:22px 0 28px;text-align:center;font-size:14px;color:var(--ink-soft)}
footer strong{font-family:var(--serif);font-style:italic;color:var(--ink);font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#1D2A47;font-weight:700;text-decoration:none;border:2px solid #1D2A47;border-radius:8px;padding:11px 20px;box-shadow:4px 4px 0 var(--navy)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--navy)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:var(--ink)}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:13px;font-weight:700;background:transparent;margin:0 6px 6px 0}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:stretch}
.hero-copy h2{font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(34px,5.2vw,58px);line-height:1.08;margin:0 0 18px}
.hero-copy p{max-width:56ch;color:var(--ink-soft);margin:0 0 24px;font-size:18px}
.latest{background:var(--navy);color:var(--on-navy);border-radius:10px;padding:26px;border:2px solid var(--navy);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.latest::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(242,84,45,.35)}
.latest .lbl{font-family:var(--hand);font-size:24px;color:var(--yellow);position:relative;z-index:1}
.latest h3{margin:0;font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.1;position:relative;z-index:1}
.latest .date{color:var(--on-navy-soft);margin:0 0 10px;position:relative;z-index:1}
.latest ul{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid rgba(255,246,224,.25)}
.latest li{padding:9px 0;border-bottom:1px solid rgba(255,246,224,.25);font-size:15.5px}
.latest .btn{align-self:flex-start;margin-top:auto;box-shadow:none;position:relative;z-index:1}

.band{margin-top:56px}
.band h2{font-family:var(--serif);font-weight:800;font-size:clamp(26px,3.6vw,36px);margin:0 0 6px;line-height:1.15}
.band .sub{margin:0 0 20px;color:var(--ink-soft)}

/* picker */
.picker{border:2px solid var(--ink);border-radius:10px;padding:22px;background:var(--card)}
.years{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.years button{background:transparent;border:2px solid var(--ink);border-radius:999px;padding:4px 18px;font-weight:700;font-family:var(--serif);font-size:20px}
.years button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.m{display:flex;flex-direction:column;justify-content:center;min-height:78px;padding:10px 14px;border-radius:8px;border:2px dashed color-mix(in srgb,var(--ink) 35%,transparent);color:color-mix(in srgb,var(--ink) 55%,transparent);font-weight:600;text-decoration:none;background:transparent}
.m small{font-weight:500;font-size:12.5px}
a.m{border:2px solid var(--ink);background:var(--navy);color:var(--on-navy);box-shadow:4px 4px 0 var(--orange)}
a.m:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--orange)}
a.m small{color:var(--yellow)}
a.m b{font-family:var(--serif);font-size:20px}
.picker-note{margin:16px 0 0;font-size:14.5px;color:var(--ink-soft)}

.involve{background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.involve h2{margin:0}
.involve ul{margin:0 0 12px;padding-left:20px}
.involve li{margin-bottom:4px}

/* page titles */
.page-title{font-family:var(--serif);font-weight:800;font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 8px}
.crumbs{font-size:14.5px;margin-bottom:14px}
.crumbs a{color:var(--accent-text);font-weight:600}

/* issue */
.issue-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:28px}
.issue-head h2{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,48px);margin:0}
.issue-head span{font-weight:600;color:var(--ink-soft)}
.issue-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);font-size:15px}
.toc h3{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 8px}
.toc ol{list-style:none;margin:0;padding:0;border-left:3px solid var(--navy)}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 12px;line-height:1.35;font-weight:500}
.toc button:hover{background:var(--yellow);color:#1D2A47}
.issue-body>section{margin-bottom:60px;scroll-margin-top:20px}
.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700;font-size:14px}
.sec-head h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.2}
.sec-sub{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--ink-soft);margin:0 0 20px}
.kicker{color:var(--accent-text);font-weight:700;font-size:14px;margin:0 0 2px}
.issue-body h3{font-family:var(--serif);font-weight:800;font-size:clamp(22px,2.8vw,28px);line-height:1.2;margin:0 0 10px}
.issue-body h4{font-family:var(--serif);font-style:italic;font-weight:800;font-size:19px;margin:20px 0 4px}
.issue-body p{margin:0 0 14px;max-width:72ch}
.by{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.quote{border:2px solid var(--ink);background:var(--yellow);color:#1D2A47;border-radius:6px;padding:14px 16px;font-family:var(--serif);font-style:italic;font-weight:800;box-shadow:4px 4px 0 var(--navy);margin-bottom:6px}

.panel-navy{background:var(--navy);color:var(--on-navy);border-radius:10px;padding:28px;border:2px solid var(--navy)}
.panel-navy h3{color:var(--yellow)}
.panel-navy p{max-width:none}
.panel-navy .by{color:var(--on-navy-soft)}
.panel-navy .kicker{color:var(--yellow)}
.sign{font-family:var(--serif);font-style:italic;font-weight:800;font-size:24px;color:var(--yellow);margin:14px 0 0}
.note-hand{font-family:var(--hand);font-size:23px;color:var(--yellow);margin:6px 0 0}

.spot{background:var(--peach);border-radius:10px;padding:28px;display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center}
.medal{width:170px;height:170px;border-radius:50%;background:conic-gradient(#FFD23F,#F2542D,#4C9F5B,#FFD23F);display:grid;place-items:center;margin-inline:auto}
.medal div{width:134px;height:134px;border-radius:50%;background:var(--paper);color:#1D2A47;text-align:center;display:flex;flex-direction:column;justify-content:center}
.medal b{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1;color:#F2542D}
.medal small{font-weight:700;font-size:10.5px;line-height:1.2;margin-top:4px}

.top-rule-teal{border-top:5px solid var(--teal);padding-top:12px}
.top-rule-orange{border-top:5px solid var(--orange);padding-top:12px}

.grads{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grad{background:var(--card);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:8px;overflow:hidden}
.grad img{width:100%;aspect-ratio:1/1.05;object-fit:cover;object-position:top}
.grad-body{padding:16px 18px 20px}
.grad h3{margin-bottom:2px}
.role{font-weight:700;font-size:14.5px;line-height:1.35;margin:0 0 10px}
.grad-body p:last-child{margin:0;font-size:15.5px}
.cls{display:inline-block;background:var(--yellow);color:#1D2A47;font-weight:700;font-size:13px;padding:0 9px;border-radius:4px;margin-bottom:8px}

.sat{background:var(--yellow);color:#1D2A47;border:2px solid #1D2A47;border-radius:10px;overflow:hidden}
.sat-top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:2px dashed #1D2A47}
.sat-top h3{margin:0;font-style:italic}
.sat-grid{display:grid;grid-template-columns:1fr 1.3fr}
.sat-art{background:#FAF1DD;display:grid;place-items:center;font-size:92px;padding:30px;border-right:2px dashed #1D2A47}
.sat-art span{display:block;background:#fff;border:2px solid #1D2A47;border-radius:12px;padding:14px 26px}
.sat-text{padding:20px 24px}
.sat-text p{margin:0 0 6px;max-width:none}
.sat-text .beat{font-size:15px;margin-bottom:8px}
.sat-text .punch{font-family:var(--serif);font-style:italic;font-weight:800;margin-top:14px}
.stamp{display:inline-block;border:2px solid #E8431B;color:#C0361A;font-family:var(--hand);font-size:20px;font-weight:700;padding:0 10px;border-radius:5px;transform:rotate(-3deg);margin-top:6px}

.dyk{background:var(--mint);border-radius:10px;padding:22px 26px;display:flex;gap:18px;align-items:flex-start}
.dyk .ic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-size:24px}
.dyk h3{font-style:italic;font-size:21px}
.dyk p{margin:0}

.creative{background:linear-gradient(120deg,#E4DDF3 0%,#F3E6C8 100%);border-radius:10px;padding:32px;display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:36px;align-items:center}
:root[data-theme="dark"] .creative{background:linear-gradient(120deg,#2A2650,#1A2440)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .creative{background:linear-gradient(120deg,#2A2650,#1A2440)}}
.polaroid{background:#fff;color:#1D2A47;padding:16px 16px 14px;transform:rotate(-2.5deg);box-shadow:0 14px 30px rgba(20,20,60,.25);text-align:center}
.polaroid img{width:100%;border:1px solid #ddd}
.polaroid .pg{font-family:var(--serif);font-weight:800;font-size:20px;border-top:2px dashed #bbb;margin-top:14px;padding-top:10px}
.polaroid .pg span{background:linear-gradient(transparent 55%,#FFD23F 55%);padding:0 10px}
.polaroid .hand{font-family:var(--hand);font-size:19px;color:#6B4FBB;margin:2px 0 0}
.polaroid .by{color:#1D2A47;font-size:12.5px}

.voice{text-align:center;padding:10px 0}
.voice .qm{font-family:var(--serif);font-weight:800;font-size:80px;line-height:.6;color:var(--orange);display:block;margin-bottom:6px}
.voice h3{font-style:italic;font-size:clamp(28px,4.4vw,44px);max-width:20ch;margin:0 auto 14px}
.voice p{margin-inline:auto;color:var(--ink-soft);font-size:19px}

.letters{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.letter{background:var(--card);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:8px;padding:22px}
.letter img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);margin-bottom:12px;background:#000}
.letter p{font-size:16px}
.letter .sig{font-family:var(--hand);font-size:28px;font-weight:700;color:var(--script);line-height:1;margin:6px 0 2px}
.letter .who{font-size:14px;color:var(--ink-soft);margin:0}

.issue-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:3px solid var(--navy);padding-top:22px}

.empty{border:2px dashed var(--ink);border-radius:10px;padding:24px}

@media (max-width:900px){
  .hero,.involve,.spot,.creative,.letters,.sat-grid,.cols{grid-template-columns:1fr}
  .issue-layout{grid-template-columns:1fr;gap:20px}
  .toc{position:static}
  .toc ol{display:flex;flex-wrap:wrap;border-left:0;gap:6px}
  .toc button{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;width:auto;font-size:14px}
  .grads{grid-template-columns:1fr}
  .grad{display:grid;grid-template-columns:130px 1fr}
  .grad img{height:100%;aspect-ratio:auto}
  .months{grid-template-columns:repeat(3,1fr)}
  .sat-art{border-right:0;border-bottom:2px dashed #1D2A47}
  .top-meta .mid{display:none}
}
@media (max-width:520px){
  body{font-size:16px}
  .grad{grid-template-columns:1fr}
  .grad img{aspect-ratio:1/1;height:auto}
  .months{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="top-meta">
      <span class="tag">Student-run</span>
      <span class="mid">Baku, Azerbaijan</span>
      <span style="display:flex;gap:8px;align-items:center"><button class="theme-btn" id="themeBtn" aria-label="Switch light or dark theme">Theme</button><span class="tag">Monthly</span></span>
    </div>
    <a class="brand" href="#/" aria-label="IB Lyceum N6 student newsletter, home">
      <h1>IB LYCEUM <span>N6</span></h1>
      <p>the student newsletter</p>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/archive" data-nav="archive">All issues</a>
      <a href="#/get-involved" data-nav="involve">Get involved</a>
    </nav>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer>
  <div class="wrap">
    <strong>IB Lyceum N6 Student Newsletter</strong><br>
    Created by students, for students. Have something to share? Send it to the newsletter team.
  </div>
</footer>

<script>
/* ============================================================
   HOW TO ADD A NEW ISSUE
   Copy the Issue 1 object inside ISSUES, change id ("YYYY-MM"),
   number, year, month (1-12), date and the sections.
   The year and month picker updates by itself.
   ============================================================ */
const CONFIG = {
  // Paste a Google Form (or other) link here and a button for the
  // anonymous "Student Voice" question will appear.
  voiceFormUrl: ""
};

    <div class="panel-navy">
      <h3 style="font-style:italic;font-size:clamp(28px,4vw,40px)">This is our newsletter. And it is your space.</h3>
      <p>The IB Lyceum N6 Student Newsletter is a place to share what's happening in our school: activities, achievements, ideas, opinions, and even the things we think could be better.</p>
      <p>Our world doesn't stop at the school gates. We'll also look beyond our walls for stories in history, science, culture and anything that matters to young people, and stay connected with the teachers and graduates who are still part of our story.</p>
      <p class="note-hand">Welcome to Issue 1. Let's see where this takes us. 💙</p>

  { id:"around", n:1, title:"Around Our School", sub:"A look at some of the people, achievements and activities that have shaped our school community this year.", html:`
    <div class="cols">
      <div>
        <p class="kicker">September in review</p>
        <h3>A new academic year has begun!</h3>
        <p>On September 1, IB Lyceum N6 opened its doors for a new academic year. Students and staff returned to school ready for new classes, new projects, new challenges and, hopefully, some new adventures along the way!</p>
        <p>The beginning of a school year is always a fresh start. New students are joining our community, familiar faces are back, and there is plenty to look forward to in the months ahead.</p>
        <h4>New faces, new beginnings</h4>
        <p>Every new academic year brings new people, new ideas and new opportunities. This year, we are happy to welcome new members to our school community. We wish all our new students and teachers a warm welcome and hope they quickly feel at home at IB Lyceum N6!</p>
      </div>
      <div>
        <p class="quote">"Good luck, Class of 2026 — we hope you'll always remember this place." 💙</p>
        <h4>A new chapter</h4>
        <p>This year, we said goodbye to the DP2 Class of 2026 as they began the next stage of their journeys. Our graduates are now heading to different countries, universities and future careers.</p>
        <p>We wish them success wherever their paths take them, and hope they will always remember the school community, values and experiences that were part of their journey here.</p>
        <p class="by">Written by Kamil Ibrahimli · MYP 4 Saturn</p>
      </div>
    </div>`},

  { id:"spotlight", n:2, title:"Student Spotlight", html:`
    <div class="spot">

        <h3>Congratulations to our recent graduate</h3>
        <p>Banu Rustamli has given us several reasons to celebrate. In March 2026, she achieved 2nd place in the national round of an international German language competition, showing her dedication and strong interest in the language.</p>
        <p>Banu also graduated with a Red Attestat, recognising her excellent academic performance throughout her school years. We are proud of her achievements and wish her every success as she begins this exciting new chapter!</p>

  { id:"achievements", n:3, title:"School & Student Achievements", html:`
    <div class="cols">
      <article class="top-rule-teal">
        <p class="kicker">From Baku to Brussels</p>
        <h3>Best Delegation at the EU model conference</h3>
        <p>This summer, our students took part in an academic trip to Brussels, joining an international conference based on the model of the European Union.</p>
        <p>During the three-day conference, students took part in discussions and visited the European Parliament, the European Parliament's Committee of the Regions, and the Embassy of Azerbaijan in Belgium.</p>
        <p>And there was even more to celebrate: our school team received the <strong>Best Delegation</strong> award! Congratulations to all the students who represented our school.</p>
      </article>
      <article class="top-rule-orange">
        <p class="kicker">Students helping students</p>
        <h3>What happens when students become teachers?</h3>
        <p>During the summer, MYP 5 students Ali Babayev and Eldeniz Najafli led a Summer Book Club for PYP 5 students preparing to enter MYP 1. They organised online reading sessions, led discussions and encouraged younger students to develop their reading habits and communication skills.</p>
        <p>Several other students also took part and received certificates for their active participation, a great reminder that sometimes students can learn from and inspire each other.</p>
        <p class="by">Written by Elvin Abbasov · MYP 3 Saturn</p>
      </article>
    </div>`},

    <div class="panel-navy">

      <h3>AI and the Luddites: are we afraid of technology, or change?</h3>
      <div class="cols">
        <div>
          <p>When we talk about artificial intelligence today, one question appears again and again: will AI take our jobs? AI can already write texts, create images, translate languages and perform tasks that once required human workers.</p>
        </div>
        <div>
          <p>But this is not the first time new technology has created such questions. In early 19th-century Britain, the Luddites were textile workers who resisted new machines they believed threatened their jobs. The movement began in 1811, when workers destroyed machinery in textile workshops.</p>
        </div>
      </div>
      <p style="border-left:5px solid var(--orange);padding-left:16px;margin:8px 0 18px;font-family:var(--serif);font-style:italic;font-weight:800;font-size:20px;color:var(--yellow)">"The problem was not simply the existence of machines — it was how the technology was introduced, and who would benefit from it."</p>
      <div class="cols">
        <div>
          <p>Artificial intelligence is changing workplaces once again. Some jobs may shrink or disappear, while entirely new ones emerge. Students today are learning skills that may look very different from those of previous generations.</p>

        <div>
          <p>The Luddites lived in a world transformed by machines. We are living through another period of rapid technological change. The machines have changed, but perhaps one question hasn't: when technology changes our future, who gets to decide what that future looks like?</p>

/* ---------------- helpers ---------------- */
const $app = document.getElementById("app");
const sorted = () => [...ISSUES].sort((a,b)=> (b.year-a.year)||(b.month-a.month));
const findIssue = id => ISSUES.find(i=>i.id===id);
const years = () => [...new Set(ISSUES.map(i=>i.year))].sort((a,b)=>b-a);
const monthLabel = i => `${MONTHS[i.month-1]} ${i.year}`;

function pickerHTML(year){
  const ys = years();
  const btns = ys.map(y=>`<button type="button" data-year="${y}" aria-pressed="${y===year}">${y}</button>`).join("");
  const tiles = MONTHS.map((m,idx)=>{
    const iss = ISSUES.find(i=>i.year===year && i.month===idx+1);
    return iss
      ? `<a class="m" href="#/issue/${iss.id}"><b>${m}</b><small>Issue ${iss.number}</small></a>`
      : `<span class="m" aria-disabled="true"><span>${m}</span><small>No issue</small></span>`;
  }).join("");
  return `<div class="picker" data-picker>
    <div class="years" role="group" aria-label="Choose a year">${btns}</div>
    <div class="months" role="group" aria-label="Choose a month">${tiles}</div>
    <p class="picker-note">Pick a year, then a month. Dark tiles have a published issue.</p>
  </div>`;
}
function wirePicker(root){
  const p = root.querySelector("[data-picker]");
  if(!p) return;
  p.addEventListener("click", e=>{
    const b = e.target.closest("[data-year]");
    if(!b) return;
    const y = +b.dataset.year;
    const tmp = document.createElement("div");
    tmp.innerHTML = pickerHTML(y);
    p.replaceWith(tmp.firstElementChild);
    wirePicker(root);
    root.querySelector(`[data-year="${y}"]`)?.focus();
  });
}

/* ---------------- views ---------------- */
function viewHome(){
  const latest = sorted()[0];
  const list = latest.highlights.map(h=>`<li>${h}</li>`).join("");
  $app.innerHTML = `
  <section class="hero">
    <div class="hero-copy">
      <h2><span class="hl">This is our newsletter.</span> And it is your space.</h2>
      <p>News, achievements, opinions and creative work from IB Lyceum N6, written by students. We also look beyond the school gates and stay in touch with the teachers and graduates who are still part of our story.</p>
      <a class="btn" href="#/issue/${latest.id}">Read the latest issue</a>
      <a class="btn ghost" href="#/archive" style="margin-left:10px">Browse all issues</a>
    </div>
    <aside class="latest" aria-label="Latest issue">
      <span class="lbl">Latest issue</span>
      <h3>Issue ${latest.number}</h3>
      <p class="date">${latest.date}</p>
      <ul>${list}</ul>
      <a class="btn" href="#/issue/${latest.id}">Open Issue ${latest.number}</a>
    </aside>
  </section>

  <section class="band" aria-labelledby="findH">
    <h2 id="findH">Find an issue</h2>
    <p class="sub">Choose a year and a month to open that newsletter.</p>
    ${pickerHTML(latest.year)}
  </section>

  <section class="band involve" aria-labelledby="invH">
    <div>
      <h2 id="invH">Get involved</h2>
      <p style="margin:6px 0 0;color:var(--ink-soft)">The newsletter is made by you. All grades are welcome.</p>
    </div>
    <div>
      <ul>
        <li>Have an idea? Write about it.</li>
        <li>Have something to share? Send it to us.</li>
        <li>Have an opinion? Let us hear it.</li>
        <li>Have a talent? Show us.</li>
      </ul>
      <span class="chip">Published monthly</span><span class="chip">All grades welcome</span>
    </div>
  </section>`;
  wirePicker($app);
}

function viewArchive(){
  const list = sorted().map(i=>`
    <li style="padding:14px 0;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <span><strong style="font-family:var(--serif);font-size:22px">Issue ${i.number}</strong> <span style="color:var(--ink-soft)">· ${monthLabel(i)} · published ${i.date}</span></span>
      <a class="btn ghost" href="#/issue/${i.id}">Read</a>
    </li>`).join("");
  $app.innerHTML = `
    <h2 class="page-title"><span class="hl">All issues</span></h2>
    <p style="color:var(--ink-soft);margin:14px 0 24px">Choose a year and month, or scroll down for the full list.</p>
    ${pickerHTML(sorted()[0].year)}
    <h3 style="font-family:var(--serif);font-size:26px;margin:44px 0 4px">Every issue, newest first</h3>
    <ul style="list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)">${list}</ul>`;
  wirePicker($app);
}

function viewInvolve(){
  $app.innerHTML = `
    <h2 class="page-title"><span class="hl">Get involved</span></h2>
    <p style="max-width:60ch;color:var(--ink-soft);font-size:18px;margin:16px 0 28px">This newsletter is created by students, for students, and it is published every month. Anyone from any grade can contribute.</p>
    <div class="involve">
      <div>
        <ul>
          <li>Have an idea? Write about it.</li>
          <li>Have something to share? Send it to us.</li>
          <li>Have an opinion? Let us hear it.</li>
          <li>Have a talent? Show us.</li>
        </ul>
        <p style="margin:0">Send your work to the newsletter team. Art, photography, poems, comics and articles are all welcome in the Creative Corner.</p>
      </div>
      <div class="voice" style="text-align:left;padding:0">
        <h3 style="margin:0 0 10px;font-size:clamp(24px,3vw,32px)">If you could change one thing about school life, what would it be?</h3>
        <p style="margin:0 0 12px;font-size:17px">Your answers will be collected anonymously.</p>
        ${CONFIG.voiceFormUrl ? `<a class="btn" href="${CONFIG.voiceFormUrl}" target="_blank" rel="noopener">Share your answer</a>` : ""}
      </div>
    </div>`;
}

function viewIssue(id){
  const iss = findIssue(id);
  if(!iss){
    $app.innerHTML = `<div class="empty"><h2 class="page-title" style="font-size:32px">We couldn't find that issue</h2><p>Pick a year and month from the archive to open a published newsletter.</p><a class="btn" href="#/archive">Go to all issues</a></div>`;
    return;
  }
  const all = sorted();
  const idx = all.findIndex(i=>i.id===id);
  const newer = all[idx-1], older = all[idx+1];
  const toc = iss.sections.map(s=>`<li><button type="button" data-go="${s.id}">${s.toc||s.title}</button></li>`).join("");
  const body = iss.sections.map(s=>{
    const head = s.plain ? "" : `<div class="sec-head"><span class="num" aria-hidden="true">${s.n}</span><h2><span class="hl">${s.title}</span></h2></div>${s.sub?`<p class="sec-sub">${s.sub}</p>`:""}`;
    return `<section id="${s.id}" aria-label="${s.title}">${head}${s.html}</section>`;
  }).join("");
  $app.innerHTML = `
    <p class="crumbs"><a href="#/">Home</a> / <a href="#/archive">All issues</a> / ${monthLabel(iss)}</p>
    <div class="issue-head">
      <h2>Issue ${iss.number}</h2>
      <span>${iss.date}</span><span>Baku, Azerbaijan</span><span>Created by students, for students</span>
    </div>
    <div class="issue-layout">
      <nav class="toc" aria-label="In this issue"><h3>In this issue</h3><ol>${toc}</ol></nav>
      <div class="issue-body">${body}
        <div class="issue-nav">
          ${older?`<a class="btn ghost" href="#/issue/${older.id}">Older: ${monthLabel(older)}</a>`:`<span></span>`}
          <a class="btn ghost" href="#/archive">All issues</a>
          ${newer?`<a class="btn ghost" href="#/issue/${newer.id}">Newer: ${monthLabel(newer)}</a>`:`<span></span>`}
        </div>
      </div>
    </div>`;
  $app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    document.getElementById(b.dataset.go)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto":"smooth"});
  }));
  document.title = `Issue ${iss.number} · ${monthLabel(iss)} · IB Lyceum N6`;
}

/* ---------------- router ---------------- */
function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const [view,arg] = h.split("/");
  document.title = "IB Lyceum N6 · The Student Newsletter";
  let nav = "home";
  if(view==="archive"){viewArchive();nav="archive";}
  else if(view==="get-involved"){viewInvolve();nav="involve";}
  else if(view==="issue"){viewIssue(arg);nav="archive";}
  else {viewHome();}
  document.querySelectorAll("[data-nav]").forEach(a=>{
    a.dataset.nav===nav ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* theme toggle (kept in memory for this visit) */
const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click",()=>{
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

route();
</script>
